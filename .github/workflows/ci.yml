name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to no token permissions; each job grants exactly what it needs.
# Jobs added later without their own `permissions:` block then fail closed
# instead of inheriting broad default access.
permissions: {}

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # @anthropic-ai/claude-code declares "engines": {"node": ">=22.0.0"}.
      # On an older Node, `npm install -g` with no version pin silently
      # resolves the newest version whose declared engines are satisfied
      # instead of @latest -- not an error, so this fails quietly rather
      # than loudly. That stale version didn't yet recognize this plugin's
      # userConfig `options` key, so keep node-version >= 22 here.
      CLAUDE_CODE_VERSION: 2.1.295
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate plugin manifest
        run: claude plugin validate --strict .

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, copied from that release's
      # own checksums.txt and pinned here -- downloading checksums.txt at
      # job time would only verify the tarball against another file served
      # from the same, possibly-compromised, release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the scan covers everything the public repo ever
          # shipped, not just the current tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          TMP="$(mktemp -d)"
          BASE="gitleaks_${GITLEAKS_VERSION}"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          ASSET="${BASE}_linux_x64.tar.gz"
          curl -fsSL "$URL/${ASSET}" -o "$TMP/${ASSET}"
          echo "${GITLEAKS_SHA256}  $TMP/${ASSET}" | sha256sum -c -
          tar -xzf "$TMP/${ASSET}" -C "$TMP" gitleaks
          echo "$TMP" >> "$GITHUB_PATH"

      - name: Scan for secrets
        # --redact: the JSON report would otherwise hold each finding's secret
        # in plaintext, and any signed-in GitHub user can download the
        # uploaded artifact below. --redact keeps file/line/commit but
        # replaces the matched text with "REDACTED".
        run: gitleaks git --report-format json --report-path gitleaks-report.json --redact .

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
